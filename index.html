<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | TIMUTKA GAME 3D</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">TIMUTKA GAME 3D</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/web.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/web.data",
        frameworkUrl: buildUrl + "/web.framework.js",
        codeUrl: buildUrl + "/web.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "TIMUTKA GAME 3D",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };

          // ============================================================
          // ГЕЙМПАД — опрос и отправка данных в Unity
          // Формат строки: lx,ly,rx,ry,A,B,X,Y
          // ============================================================
          var gamepadIndex = -1;
          var pollingStarted = false;

          window.addEventListener("gamepadconnected", (e) => {
            gamepadIndex = e.gamepad.index;
            console.log("Геймпад подключён:", e.gamepad.id);
            if (!pollingStarted) {
              pollingStarted = true;
              pollGamepad();
            }
          });

          window.addEventListener("gamepaddisconnected", (e) => {
            console.log("Геймпад отключён:", e.gamepad.id);
            if (e.gamepad.index === gamepadIndex) gamepadIndex = -1;
          });

          function pollGamepad() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];

            if (gamepadIndex === -1) {
              for (let i = 0; i < gamepads.length; i++) {
                if (gamepads[i]) { gamepadIndex = i; break; }
              }
            }

            const gp = gamepadIndex >= 0 ? gamepads[gamepadIndex] : null;

            if (gp) {
              const ax = gp.axes;
              const bt = gp.buttons;

              const dead = 0.15;
              const dz = (v) => Math.abs(v) < dead ? 0 : v;

              const lx = dz(ax[0] || 0).toFixed(3);
              const ly = dz(ax[1] || 0).toFixed(3);
              const rx = dz(ax[2] || 0).toFixed(3);
              const ry = dz(ax[3] || 0).toFixed(3);

              const A = (bt[0] && bt[0].pressed) ? 1 : 0;
              const B = (bt[1] && bt[1].pressed) ? 1 : 0;
              const X = (bt[2] && bt[2].pressed) ? 1 : 0;
              const Y = (bt[3] && bt[3].pressed) ? 1 : 0;

              const dataString = lx + "," + ly + "," + rx + "," + ry + "," + A + "," + B + "," + X + "," + Y;

              try {
                unityInstance.SendMessage("GamepadManager", "OnGamepadData", dataString);
              } catch (err) { /* объект ещё не создан — пропускаем */ }
            }

            requestAnimationFrame(pollGamepad);
          }

          // Если геймпад был подключён до загрузки страницы
          if (navigator.getGamepads && navigator.getGamepads().some(g => g)) {
            pollingStarted = true;
            pollGamepad();
          }
          // ============================================================

        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
